<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SSM-LPRS | Admin Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container" style="max-width: 500px;">
        <header>
            <h1 style="background: -webkit-linear-gradient(45deg, #ff4b2b, #ff416c); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Admin Portal</h1>
            <p>Sign in or Register as Administrator</p>
        </header>
        <main style="display: block;">
            <div id="error-message" class="error hidden"></div>
            <div class="card">
                <div class="form-group">
                    <label>Admin Username:</label>
                    <input type="text" id="username" class="styled-select">
                </div>
                <div class="form-group">
                    <label>Admin Password:</label>
                    <input type="password" id="password" class="styled-select">
                </div>
                
                <div id="login-form">
                    <button id="login-btn" class="primary-btn" style="background: linear-gradient(45deg, #ff416c, #ff4b2b);">Admin Login</button>
                    <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                        New Admin? <a href="#" id="show-signup" style="color: #ff4b2b;">Register here</a>
                    </p>
                </div>

                <div id="signup-form" class="hidden">
                    <button id="register-admin-btn" class="primary-btn" style="background: linear-gradient(45deg, #ff416c, #ff4b2b);">Register Admin</button>
                    <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                        Already an Admin? <a href="#" id="show-login" style="color: #ff4b2b;">Login here</a>
                    </p>
                </div>
                
                <div style="text-align: center; margin-top: 25px;">
                    <a href="index.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem;">← Back to Student Login</a>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000';

        document.getElementById('show-signup').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('signup-form').classList.remove('hidden');
        });

        document.getElementById('show-login').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('signup-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        });

        document.getElementById('login-btn').addEventListener('click', () => auth('login'));
        document.getElementById('register-admin-btn').addEventListener('click', () => register('admin'));

        async function auth(action) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if(!username || !password) return showError("Please enter credentials");

            try {
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                const data = await res.json();
                if(!res.ok) throw new Error(data.detail);

                if(data.role !== 'admin') {
                    throw new Error("Access denied. You are not an admin.");
                }

                localStorage.setItem('token', data.access_token);
                localStorage.setItem('role', data.role);
                window.location.href = 'admin.html';
            } catch (e) {
                showError(e.message);
            }
        }

        async function register(role) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if(!username || !password) return showError("Please enter credentials to register");

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });
                const data = await res.json();
                if(!res.ok) throw new Error(data.detail);
                
                alert(`Registered successfully as ${role}. You can now login.`);
                document.getElementById('show-login').click();
            } catch (e) {
                showError(e.message);
            }
        }

        function showError(msg) {
            const err = document.getElementById('error-message');
            err.textContent = msg;
            err.classList.remove('hidden');
        }
    </script>
</body>
</html>
