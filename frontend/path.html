<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Path | SSM-LPRS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;}
        .logout-btn { background: transparent; border: 1px solid var(--primary-accent); color: var(--primary-accent); padding: 5px 15px; border-radius: 5px; cursor: pointer;}
        .path-controls { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
        .content-box { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 12px; padding: 1.2rem; }
        
        #graph-container {
            width: 100%;
            min-height: 700px;
            background: radial-gradient(circle at center, rgba(0,210,255,0.08), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            overflow: hidden;
        }
        
        #network-svg {
            width: 100%;
            height: 100%;
        }
        
        .link {
            stroke: rgba(100, 150, 200, 0.4);
            stroke-width: 2px;
        }
        
        .link.active {
            stroke: rgba(0, 210, 255, 0.8);
            stroke-width: 3px;
        }
        
        .node circle {
            stroke-width: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .node circle:hover {
            r: 28;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        }
        
        .node.locked circle {
            opacity: 0.5;
            filter: grayscale(0.4);
        }
        
        .node.active circle {
            stroke: rgba(0, 210, 255, 0.9);
            filter: drop-shadow(0 0 12px rgba(0, 210, 255, 0.6));
        }
        
        .node.completed circle {
            stroke: rgba(46, 213, 115, 0.9);
        }
        
        .node text {
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: middle;
            font-size: 12px;
            font-weight: 600;
            fill: white;
            paint-order: stroke;
            stroke: rgba(0, 0, 0, 0.8);
            stroke-width: 2px;
        }
        
        .node .label-bg {
            opacity: 0.85;
        }
        
        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
            z-index: 100;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        
        #path-summary {
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        
        @media (max-width: 900px) { 
            #graph-container { min-height: 500px; }
        }
    </style>
</head>
<body>
    <div class="glass-container" style="max-width: 1400px;">
        <div class="top-bar">
            <div>
                <a href="dashboard.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">← Back to Topics</a>
                <h2 id="path-title" style="margin-top: 10px;">Learning Path</h2>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <main style="display: block;">
            <section class="card">
                <div class="path-controls">
                    <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                        <button id="linear-mode" class="primary-btn" style="width:auto; padding:8px 14px; margin-top:0;">Linear Path</button>
                        <button id="dynamic-mode" class="primary-btn" style="width:auto; padding:8px 14px; margin-top:0; background: rgba(255,255,255,0.08);">Dynamic Path</button>
                    </div>
                    <a href="concept-map.html" id="open-map-link" class="primary-btn" style="display:inline-block; width:auto; padding:10px 18px; margin-top:0; text-decoration:none; text-align:center;">Full Network Map</a>
                </div>
                
                <div id="path-summary"></div>

                <div class="content-box" style="position: relative;">
                    <h3 style="margin-bottom: 1rem;">Mathematics Learning Network</h3>
                    
                    <div id="graph-container">
                        <svg id="network-svg"></svg>
                        <div class="legend">
                            <div style="font-weight: 600; margin-bottom: 8px;">Difficulty Level</div>
                            <div class="legend-item">
                                <div class="legend-dot" style="background: rgba(173, 216, 230, 0.8);"></div>
                                <span>Foundational (SS1)</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-dot" style="background: rgba(144, 238, 144, 0.8);"></div>
                                <span>Intermediate (SS2)</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-dot" style="background: rgba(250, 128, 114, 0.8);"></div>
                                <span>Advanced (SS3)</span>
                            </div>
                        </div>
                    </div>
                    
                    <div id="module-content" style="margin-top: 1.2rem;"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="path.js"></script>
</body>
</html>
