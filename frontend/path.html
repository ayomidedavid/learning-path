<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Path | SSM-LPRS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;}
        .logout-btn { background: transparent; border: 1px solid var(--primary-accent); color: var(--primary-accent); padding: 5px 15px; border-radius: 5px; cursor: pointer;}
        .path-layout { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; }
        .path-list { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }
        .path-step { background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: 10px; padding: 0.8rem 1rem; cursor: pointer; color: white; }
        .path-step.active { border-color: var(--primary-accent); box-shadow: 0 0 10px rgba(0, 210, 255, 0.2); }
        .path-step.done { border-color: rgba(46, 213, 115, 0.7); }
        .content-box { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 12px; padding: 1.2rem; }
        .quiz-option { display: block; margin: 0.6rem 0; padding: 0.7rem 0.9rem; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); cursor: pointer; }
        .quiz-option.correct { background: rgba(46, 213, 115, 0.15); border-color: rgba(46, 213, 115, 0.6); }
        .quiz-option.wrong { background: rgba(255, 71, 87, 0.12); border-color: rgba(255, 71, 87, 0.5); }
        .concept-map {
            position: relative;
            min-height: 360px;
            background: radial-gradient(circle at center, rgba(0,210,255,0.08), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            overflow: hidden;
            padding: 1rem;
        }
        .network-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .network-link {
            fill: none;
            stroke: rgba(0, 210, 255, 0.45);
            stroke-width: 2;
            stroke-linecap: round;
        }
        .graph-nodes {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 320px;
        }
        .concept-node {
            position: absolute;
            transform: translate(-50%, -50%);
            min-width: 118px;
            max-width: 172px;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 18px;
            padding: 0.7rem 0.8rem;
            text-align: center;
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            z-index: 1;
        }
        .concept-node:hover { transform: translate(-50%, -50%) scale(1.04); }
        .concept-node.main {
            min-width: 150px;
            max-width: 210px;
            padding: 0.9rem 1rem;
            font-weight: 700;
        }
        .concept-node.active {
            border-color: var(--primary-accent);
            box-shadow: 0 0 18px rgba(0, 210, 255, 0.3);
        }
        .concept-node.done {
            border-color: rgba(46, 213, 115, 0.7);
        }
        .concept-node.locked {
            opacity: 0.55;
            filter: grayscale(0.25);
        }
        .node-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
        }
        .node-title {
            font-size: 0.78rem;
            line-height: 1.25;
            font-weight: 600;
            word-break: break-word;
        }
        .node-lock {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 0.7rem;
        }
        @media (max-width: 900px) { .path-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="glass-container" style="max-width: 1200px;">
        <div class="top-bar">
            <div>
                <a href="dashboard.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">← Back to Topics</a>
                <h2 id="path-title" style="margin-top: 10px;">Learning Path</h2>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <main style="grid-template-columns: 1fr; display: block;">
            <section class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom: 1rem;">
                    <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                        <button id="linear-mode" class="primary-btn" style="width:auto; padding:8px 14px; margin-top:0;">Linear Path</button>
                        <button id="dynamic-mode" class="primary-btn" style="width:auto; padding:8px 14px; margin-top:0; background: rgba(255,255,255,0.08);">Dynamic Path</button>
                    </div>
                    <a href="concept-map.html" id="open-map-link" class="primary-btn" style="display:inline-block; width:auto; padding:10px 18px; margin-top:0; text-decoration:none; text-align:center;">Open Network Map</a>
                </div>
                <div id="path-summary" style="padding: 0.8rem 1rem; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-secondary); margin-bottom: 1rem;"></div>

                <div class="path-layout">
                    <div class="content-box">
                        <h3 style="margin-bottom: 0.75rem;">Learning Route</h3>
                        <ul id="path-list" class="path-list"></ul>
                    </div>

                    <div class="content-box">
                        <div id="concept-map" class="concept-map" aria-label="Learning concept map"></div>
                        <div id="module-content" style="margin-top: 1.2rem;"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="path.js"></script>
</body>
</html>
