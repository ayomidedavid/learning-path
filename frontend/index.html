<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SSM-LPRS | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container" style="max-width: 500px;">
        <header>
            <h1>SSM-LPRS</h1>
            <p>Sign in to your Learning Path</p>
        </header>
        <main style="display: block;">
            <div id="error-message" class="error hidden"></div>
            <div class="card">
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="username" class="styled-select">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="password" class="styled-select">
                </div>
                
                <div id="login-form">
                    <button id="login-btn" class="primary-btn">Login</button>
                    <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                        Don't have an account? <a href="#" id="show-signup" style="color: var(--primary-accent);">Sign up</a>
                    </p>
                </div>

                <div id="signup-form" class="hidden">
                    <button id="register-btn" class="primary-btn" style="background: var(--glass-border);">Register Student</button>
                    <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                        Already have an account? <a href="#" id="show-login" style="color: var(--primary-accent);">Login</a>
                    </p>
                </div>
                
                <div style="text-align: center; margin-top: 25px; border-top: 1px solid var(--glass-border); padding-top: 15px;">
                    <a href="admin_login.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem;">Admin Access</a>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
