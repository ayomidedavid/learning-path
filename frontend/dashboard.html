<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SSM-LPRS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;}
        .logout-btn { background: transparent; border: 1px solid var(--primary-accent); color: var(--primary-accent); padding: 5px 15px; border-radius: 5px; cursor: pointer;}
        
        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .topic-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .topic-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.2);
            border-color: var(--primary-accent);
        }

        .topic-card h4 {
            color: white;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .topic-card span {
            background: rgba(0, 210, 255, 0.2);
            color: var(--primary-accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .search-bar {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            font-family: inherit;
        }
        .search-bar:focus {
            outline: none;
            border-color: var(--primary-accent);
        }
        .user-panel {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            padding: 0.85rem 1rem;
            border-radius: 12px;
            min-width: 220px;
        }
        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
            color: white;
            font-weight: 800;
        }
        .user-meta small {
            color: var(--text-secondary);
        }
        .dynamic-selector {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
        }
        .dynamic-selector.show {
            display: block;
        }
        .styled-select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            margin-top: 0.7rem;
        }
        .dynamic-selector .primary-btn {
            width: auto;
            margin-top: 1rem;
            padding: 10px 18px;
        }
    </style>
</head>
<body>
    <div class="glass-container" style="max-width: 1200px;">
        <div class="top-bar">
            <div>
                <h2>Select a Learning Mode and Topic</h2>
                <div class="user-panel" id="user-panel" style="margin-top: 10px;">
                    <div class="user-avatar" id="user-avatar">S</div>
                    <div class="user-meta">
                        <div id="user-name">Loading...</div>
                        <small id="user-role">Student</small>
                    </div>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <main style="grid-template-columns: 1fr; display: block;">
            <div class="card" style="margin-bottom: 1.5rem;">
                <h3 style="margin-bottom: 1rem;">Choose your learning path</h3>
                <div style="display:flex; gap:1rem; flex-wrap:wrap;">
                    <button class="primary-btn" id="linear-mode-btn" style="width:auto; padding: 10px 18px; margin-top:0;">Linear Path</button>
                    <button class="primary-btn" id="dynamic-mode-btn" style="width:auto; padding: 10px 18px; margin-top:0; background: rgba(255,255,255,0.08);">Dynamic Path</button>
                </div>

                <div id="dynamic-selector" class="dynamic-selector">
                    <label for="dynamic-topic-select" style="color: var(--text-secondary);">Select a topic to start from</label>
                    <select id="dynamic-topic-select" class="styled-select">
                        <option value="">Choose a topic</option>
                    </select>
                    <button id="generate-dynamic-path-btn" class="primary-btn">Generate My Path</button>
                </div>
            </div>

            <input type="text" id="search" class="search-bar" placeholder="Search for a math topic... (e.g. Integration, Vectors, Matrices)">
            
            <div id="topics-container" class="topics-grid">
                <!-- Topics injected here -->
            </div>
        </main>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('learningMode');
            window.location.href = 'index.html';
        }

        let allTopics = [];
        const defaultMode = localStorage.getItem('learningMode') || 'linear';

        function setMode(mode) {
            localStorage.setItem('learningMode', mode);
            const linearBtn = document.getElementById('linear-mode-btn');
            const dynamicBtn = document.getElementById('dynamic-mode-btn');
            const selector = document.getElementById('dynamic-selector');
            const search = document.getElementById('search');
            const topicsContainer = document.getElementById('topics-container');
            linearBtn.style.background = mode === 'linear' ? 'linear-gradient(45deg, var(--secondary-accent), var(--primary-accent))' : 'rgba(255,255,255,0.08)';
            dynamicBtn.style.background = mode === 'dynamic' ? 'linear-gradient(45deg, var(--secondary-accent), var(--primary-accent))' : 'rgba(255,255,255,0.08)';

            if (mode === 'dynamic') {
                selector.classList.add('show');
                topicsContainer.style.display = 'none';
                search.style.display = 'none';
            } else {
                selector.classList.remove('show');
                topicsContainer.style.display = 'grid';
                search.style.display = 'block';
            }
        }

        function renderUserProfile(user) {
            if (!user) return;
            const username = user.username || 'Student';
            const role = user.role ? user.role.toUpperCase() : 'STUDENT';
            document.getElementById('user-name').textContent = username;
            document.getElementById('user-role').textContent = `${role} • ${user.completed_count || 0} completed`;
            document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();
        }

        async function fetchUserProfile() {
            try {
                const res = await fetch(`${API_BASE}/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to fetch user info');
                const user = await res.json();
                renderUserProfile(user);
            } catch (e) {
                console.error(e);
                logout();
            }
        }

        async function fetchTopics() {
            try {
                const res = await fetch(`${API_BASE}/topics`);
                const data = await res.json();
                allTopics = data.topics;
                populateDynamicSelector(allTopics);
                renderTopics(allTopics);
            } catch (e) {
                console.error(e);
            }
        }

        function populateDynamicSelector(topics) {
            const select = document.getElementById('dynamic-topic-select');
            select.innerHTML = '<option value="">Choose a topic</option>';
            topics.forEach(t => {
                const option = document.createElement('option');
                option.value = t.id;
                option.textContent = `${t.id} (${t.grade})`;
                select.appendChild(option);
            });
        }

        function renderTopics(topics) {
            const container = document.getElementById('topics-container');
            container.innerHTML = '';
            topics.forEach(t => {
                const card = document.createElement('div');
                card.className = 'topic-card';
                card.innerHTML = `
                    <h4>${t.id}</h4>
                    <span style="display:inline-block; margin-bottom: 8px;">${t.grade}</span>
                    <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 5px;">${t.details || ''}</p>
                `;
                card.onclick = () => {
                    const mode = localStorage.getItem('learningMode') || 'linear';
                    window.location.href = `path.html?target=${encodeURIComponent(t.id)}&mode=${mode}`;
                };
                container.appendChild(card);
            });
        }

        document.getElementById('linear-mode-btn').addEventListener('click', () => setMode('linear'));
        document.getElementById('dynamic-mode-btn').addEventListener('click', () => setMode('dynamic'));
        document.getElementById('generate-dynamic-path-btn').addEventListener('click', () => {
            const selectedTopic = document.getElementById('dynamic-topic-select').value;
            if (!selectedTopic) {
                alert('Please choose a topic first.');
                return;
            }
            window.location.href = `path.html?target=${encodeURIComponent(selectedTopic)}&mode=dynamic`;
        });

        document.getElementById('search').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allTopics.filter(t => t.id.toLowerCase().includes(q));
            renderTopics(filtered);
        });

        setMode(defaultMode);
        fetchUserProfile();
        fetchTopics();
    </script>
</body>
</html>
