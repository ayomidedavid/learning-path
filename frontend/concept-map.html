<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Network Map | SSM-LPRS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            gap: 1rem;
        }
        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .map-shell {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.2rem;
        }
        .panel {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 1rem;
        }
        .zoom-box {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }
        .zoom-box input[type="range"] {
            width: 100%;
        }
        .network-stage {
            position: relative;
            width: 100%;
            min-height: 640px;
            background: radial-gradient(circle at center, rgba(0,210,255,0.08), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: auto;
            transform-origin: center center;
            transition: transform 0.2s ease;
        }
        .network-layer {
            position: relative;
            width: 1100px;
            height: 620px;
            margin: 0 auto;
        }
        .network-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .network-link {
            fill: none;
            stroke: rgba(255,255,255,0.2);
            stroke-width: 1.75;
            stroke-linecap: round;
        }
        .network-link.route {
            stroke: rgba(0, 210, 255, 0.85);
            stroke-width: 2.5;
        }
        .network-node {
            position: absolute;
            transform: translate(-50%, -50%);
            padding: 0.7rem 0.8rem;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.12);
            color: white;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 14px 26px rgba(0,0,0,0.12);
            transition: transform 0.2s ease, border-color 0.2s ease;
            white-space: normal;
            word-break: break-word;
            line-height: 1.25;
        }
        .network-node:hover {
            transform: translate(-50%, -50%) scale(1.04);
        }
        .network-node.selected {
            border-color: var(--primary-accent);
            box-shadow: 0 0 18px rgba(0, 210, 255, 0.25);
        }
        .network-node.done {
            border-color: rgba(46, 213, 115, 0.8);
        }
        .network-node.locked {
            opacity: 0.55;
            filter: grayscale(0.25);
        }
        .network-node.hub {
            min-width: 150px;
            max-width: 185px;
            padding: 0.85rem 1rem;
            font-weight: 700;
        }
        .node-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            font-size: 0.7rem;
            margin-bottom: 0.35rem;
        }
        .node-label {
            font-size: 0.76rem;
            font-weight: 600;
        }
        .status-note {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.6;
        }
        @media (max-width: 920px) {
            .map-shell {
                grid-template-columns: 1fr;
            }
            .network-stage {
                min-height: 520px;
            }
            .network-layer {
                width: 900px;
                height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="glass-container" style="max-width: 1280px;">
        <div class="top-bar">
            <div>
                <a class="back-link" href="path.html" id="back-link">← Back to learning path</a>
                <h2 style="margin-top: 10px;">Learning Network Map</h2>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <main class="map-shell">
            <aside class="panel">
                <div class="zoom-box">
                    <label for="zoom-slider" style="color: var(--text-secondary); font-weight: 600;">Zoom</label>
                    <input id="zoom-slider" type="range" min="70" max="150" value="100" />
                    <span id="zoom-value" style="min-width: 42px; text-align: right; color: var(--primary-accent); font-weight: 700;">100%</span>
                </div>

                <div class="panel" style="padding: 0.8rem; margin-bottom: 1rem; background: rgba(255,255,255,0.025);">
                    <h3 id="map-topic-title" style="margin-bottom: 0.5rem;">Topic</h3>
                    <p id="map-topic-details" class="status-note">Select a node to view details.</p>
                </div>

                <div>
                    <h4 style="margin-bottom: 0.8rem;">Legend</h4>
                    <div class="status-note" id="legend-summary">Subject clusters are grouped by family.</div>
                </div>
            </aside>

            <section class="panel">
                <div id="network-stage" class="network-stage">
                    <div id="network-map" class="network-layer"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="concept-map.js"></script>
</body>
</html>
